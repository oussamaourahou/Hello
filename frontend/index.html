<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mot de Passe Duel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>Mot de Passe Duel</h1>
            <p class="subtitle">Donnez des indices pour faire deviner le mot!</p>
            <div class="game-info">
                <div class="info-item">
                    <span class="info-label">Niveaux:</span>
                    <span class="info-value">10</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Temps par niveau:</span>
                    <span class="info-value">60 secondes</span>
                </div>
            </div>
            <button id="startBtn" class="btn-primary">Commencer le Jeu</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="level-display">
                    <span>Niveau</span>
                    <span id="currentLevel" class="level-number">1</span>
                    <span>/</span>
                    <span class="level-number">10</span>
                </div>
                <div class="timer" id="timer">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span id="timeLeft">60</span>s
                </div>
            </div>

            <div class="score-display">
                <span>Score:</span>
                <span id="score">0</span>
            </div>

            <div class="word-display">
                <div class="first-letter-label">Première lettre:</div>
                <div id="firstLetter" class="first-letter">A</div>
            </div>

            <div class="word-card">
                <div class="word-to-guess" id="wordToGuess">AVION</div>
                <div class="word-hint">Donnez un indice pour ce mot!</div>
            </div>

            <div class="action-buttons">
                <button id="skipBtn" class="btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                    Passer
                </button>
                <button id="gotItBtn" class="btn-success">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Trouvé!
                </button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="endScreen" class="screen">
            <h2 id="endTitle">Niveau Terminé!</h2>
            <div class="final-score">
                <div class="score-label">Score Final</div>
                <div id="finalScore" class="score-value">0</div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="correctAnswers">0</div>
                    <div class="stat-label">Trouvés</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="skippedAnswers">0</div>
                    <div class="stat-label">Passés</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalWords">0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
            <button id="nextLevelBtn" class="btn-primary">Niveau Suivant</button>
            <button id="restartBtn" class="btn-secondary">Recommencer</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
