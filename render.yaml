services:
  # Backend API
  - type: web
    name: email-archive-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
    disk:
      name: email-archive-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10

  # Static Frontend
  - type: web
    name: email-archive-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: echo "No build needed for static site"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: email-archive-api
          envVarKey: RENDER_EXTERNAL_URL
